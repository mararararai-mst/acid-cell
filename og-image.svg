<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(180,160,120,0.18)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D0E0F0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#FAF6E8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- タイトル -->
  <text x="60" y="92" font-family="'M PLUS Rounded 1c', sans-serif" font-size="56" font-weight="800" fill="#3A3530">⚡ うすい塩酸の電池モデル</text>
  <text x="60" y="140" font-family="'M PLUS Rounded 1c', sans-serif" font-size="28" font-weight="700" fill="#8a7a60">中3 理科 ／ 単元1-3 化学変化と電池 ／ 教科書 p.51 図4</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#D97A4B" stroke-width="3" stroke-dasharray="10,6"/>

  <!-- 装置 (中央のステージ) -->
  <g transform="translate(160, 200)">
    <!-- 電圧計 -->
    <rect x="335" y="0" width="200" height="90" fill="#FFFFFF" stroke="#3A3530" stroke-width="2.5" rx="10"/>
    <text x="435" y="28" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="18" font-weight="800" fill="#3A3530">電圧計</text>
    <path d="M 390 70 A 45 45 0 0 1 480 70" fill="none" stroke="#8a7a60" stroke-width="2"/>
    <line x1="435" y1="70" x2="455" y2="32" stroke="#D97A4B" stroke-width="4"/>
    <circle cx="435" cy="70" r="3.5" fill="#3A3530"/>
    <text x="435" y="87" text-anchor="middle" font-family="'Kaisei Decol', serif" font-size="20" font-weight="700" fill="#D97A4B">1.10 V</text>

    <!-- 導線 (電圧計の左右から電極上端へ) -->
    <line x1="120" y1="50" x2="120" y2="190" stroke="#3A3530" stroke-width="3.5"/>
    <line x1="120" y1="50" x2="335" y2="50" stroke="#3A3530" stroke-width="3.5"/>
    <line x1="535" y1="50" x2="750" y2="50" stroke="#3A3530" stroke-width="3.5"/>
    <line x1="750" y1="50" x2="750" y2="190" stroke="#3A3530" stroke-width="3.5"/>

    <!-- 電子粒子 (青円に「-」) 導線上 -->
    <g>
      <circle cx="180" cy="50" r="12" fill="#4A7BAA"/><rect x="173.5" y="48" width="13" height="3" fill="#fff"/>
      <circle cx="230" cy="50" r="12" fill="#4A7BAA"/><rect x="223.5" y="48" width="13" height="3" fill="#fff"/>
      <circle cx="280" cy="50" r="12" fill="#4A7BAA"/><rect x="273.5" y="48" width="13" height="3" fill="#fff"/>
      <circle cx="585" cy="50" r="12" fill="#4A7BAA"/><rect x="578.5" y="48" width="13" height="3" fill="#fff"/>
      <circle cx="635" cy="50" r="12" fill="#4A7BAA"/><rect x="628.5" y="48" width="13" height="3" fill="#fff"/>
      <circle cx="685" cy="50" r="12" fill="#4A7BAA"/><rect x="678.5" y="48" width="13" height="3" fill="#fff"/>
    </g>

    <!-- 矢印 (上: I 電流 Cu→Zn, 下: e⁻ 電子 Zn→Cu) -->
    <!-- I (電流) 矢印 - 上、左右で逆方向に表示 -->
    <g stroke="#D9533C" stroke-width="3" fill="none">
      <line x1="280" y1="28" x2="180" y2="28"/>
      <polygon points="180,28 195,22 195,34" fill="#D9533C" stroke="none"/>
      <line x1="685" y1="28" x2="585" y2="28"/>
      <polygon points="585,28 600,22 600,34" fill="#D9533C" stroke="none"/>
    </g>
    <text x="635" y="14" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="18" font-weight="800" fill="#D9533C">I (電流)</text>

    <!-- e⁻ (電子) 矢印 - 下、左右で同方向 (Zn→Cu) -->
    <g stroke="#4A7BAA" stroke-width="3" fill="none">
      <line x1="180" y1="72" x2="280" y2="72"/>
      <polygon points="280,72 265,66 265,78" fill="#4A7BAA" stroke="none"/>
      <line x1="585" y1="72" x2="685" y2="72"/>
      <polygon points="685,72 670,66 670,78" fill="#4A7BAA" stroke="none"/>
    </g>
    <text x="230" y="100" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="18" font-weight="800" fill="#4A7BAA">e⁻ (電子)</text>

    <!-- 容器枠 (薄く、細く) -->
    <rect x="20" y="180" width="830" height="220" fill="#FCF8E6" stroke="#A09680" stroke-width="1.8" stroke-opacity="0.5" rx="4"/>

    <!-- 電極: 亜鉛 (-, 細い: chargeLevel=0.6相当) -->
    <rect x="111" y="160" width="18" height="220" fill="#B0B4B8" stroke="#5a5a5a" stroke-width="1"/>
    <!-- 電極内ラベル (白文字、上端中央) -->
    <text x="120" y="180" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">(-)</text>
    <text x="120" y="200" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Zn</text>

    <!-- 電極: 銅 (+, 通常の太さ) -->
    <rect x="738" y="160" width="24" height="220" fill="#C97D4A" stroke="#7a4520" stroke-width="1"/>
    <text x="750" y="180" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">(+)</text>
    <text x="750" y="200" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Cu</text>

    <!-- 液中イオン -->
    <!-- Cl⁻ (亜鉛側、液中の上半分) — 電気的中性を保つため亜鉛板側に集まる -->
    <g>
      <circle cx="155" cy="230" r="20" fill="#7AB89A"/>
      <text x="155" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cl⁻</text>
      <circle cx="220" cy="245" r="20" fill="#7AB89A"/>
      <text x="220" y="249" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cl⁻</text>
      <circle cx="310" cy="230" r="20" fill="#7AB89A" opacity="0.9"/>
      <text x="310" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cl⁻</text>
      <circle cx="390" cy="225" r="20" fill="#7AB89A" opacity="0.85"/>
      <text x="390" y="229" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cl⁻</text>
    </g>

    <!-- H⁺ (銅板側、液中の下半分) — 銅板で還元される -->
    <g>
      <circle cx="490" cy="320" r="20" fill="#7BBCDB"/>
      <text x="490" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">H⁺</text>
      <circle cx="560" cy="340" r="20" fill="#7BBCDB"/>
      <text x="560" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">H⁺</text>
      <circle cx="630" cy="325" r="20" fill="#7BBCDB" opacity="0.9"/>
      <text x="630" y="329" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">H⁺</text>
      <circle cx="690" cy="345" r="20" fill="#7BBCDB" opacity="0.85"/>
      <text x="690" y="349" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">H⁺</text>
    </g>

    <!-- Zn²⁺ (液中に蓄積、亜鉛板付近に多め、最前面) -->
    <g>
      <circle cx="185" cy="290" r="22" fill="#E8A040"/>
      <text x="185" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="250" cy="310" r="22" fill="#E8A040"/>
      <text x="250" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="170" cy="345" r="22" fill="#E8A040" opacity="0.95"/>
      <text x="170" y="349" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="270" cy="360" r="22" fill="#E8A040" opacity="0.95"/>
      <text x="270" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="340" cy="295" r="22" fill="#E8A040" opacity="0.9"/>
      <text x="340" y="299" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="350" cy="350" r="22" fill="#E8A040" opacity="0.9"/>
      <text x="350" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
      <circle cx="420" cy="320" r="22" fill="#E8A040" opacity="0.85"/>
      <text x="420" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zn²⁺</text>
    </g>

    <!-- 水素気泡 (銅板表面から発生、上昇、H₂ 表記) -->
    <g>
      <circle cx="725" cy="345" r="14" fill="url(#bubbleGrad)" stroke="#90A8B0" stroke-width="1.5"/>
      <text x="725" y="349" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#3c6482">H₂</text>
      <circle cx="725" cy="295" r="16" fill="url(#bubbleGrad)" stroke="#90A8B0" stroke-width="1.5"/>
      <text x="725" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#3c6482">H₂</text>
      <circle cx="725" cy="240" r="14" fill="url(#bubbleGrad)" stroke="#90A8B0" stroke-width="1.5"/>
      <text x="725" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#3c6482">H₂</text>
    </g>

    <!-- 液体ラベル (容器枠から十分離す) -->
    <text x="435" y="425" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="20" font-weight="700" fill="#6a5a40">うすい塩酸（HCl 水溶液）</text>
  </g>

  <!-- 下部メッセージバー -->
  <g transform="translate(60, 565)">
    <rect x="0" y="0" width="1080" height="50" rx="25" fill="#D97A4B"/>
    <text x="540" y="32" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">💡 問題点：水素が出る・電圧が下がる　→　ダニエル電池への必然性が分かる導入教材</text>
  </g>
</svg>
